name: Build installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = "1.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish app
        run: dotnet publish src/PlotView/PlotView.csproj -c Release -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Check PDFium
        shell: pwsh
        run: if (-not (Test-Path publish/pdfium.dll)) { throw "pdfium.dll missing from publish output" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: '& $env:ISCC "/DAppVersion=${{ steps.ver.outputs.version }}" installer\setup.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: PlotView-Setup
          path: installer/Output/*.exe

      - name: Prepare release file
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item (Get-ChildItem installer/Output/*.exe | Select-Object -First 1).FullName release/PlotView-Setup.exe

      - name: Publish GitHub release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/PlotView-Setup.exe
